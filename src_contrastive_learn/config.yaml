# ── SimCLR Contrastive Learning Config ──────────────────────────────────────────

data:
  audio_dir: "./train_audio"
  csv_path: "./train.csv"
  submission_csv: "./sample_submission.csv"
  sr: 32000
  duration: 5
  n_mels: 128
  fmin: 20
  fmax: 16000
  soundscapes_dir: "./train_soundscapes"
  n_samples_per_soundscape: 2

model:
  backbone: efficientnet_b0    # timm backbone
  projection_dim: 128         # projection head output dim
  pretrained: true             # use ImageNet pretrained backbone

training:
  epochs: 100
  batch_size: 256
  lr: 0.001
  weight_decay: 1e-4
  temperature: 0.07           # NT-Xent temperature
  warmup_epochs: 10           # lr warmup
  scheduler: cosine            # cosine or step
  device: cuda
  seed: 42

augmentation:
  # Audio-level noise (white/pink/brown, randomly chosen)
  noise_std: 0.005            # max noise std
  # Volume jitter
  volume_jitter: 0.2          # scale range ±20%
  # Speed change via time-stretch
  speed_range: [0.8, 1.2]     # random speed factor range
  # Random silent cuts
  n_silent_cuts: 2            # number of silent segments to cut
  max_cut_ratio: 0.05         # max cut length as fraction of total

linear_eval:
  epochs: 30
  batch_size: 256
  lr: 0.01
  weight_decay: 0.0

output:
  run_dir: "./runs_contrastive"
  save_every: 10              # save checkpoint every N epochs
