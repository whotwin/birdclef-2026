# ── SimCLR Contrastive Learning Config ──────────────────────────────────────────

data:
  audio_dir: "./train_audio"
  csv_path: "./train.csv"
  submission_csv: "./sample_submission.csv"
  sr: 32000
  duration: 5
  n_mels: 128
  fmin: 20
  fmax: 16000

model:
  backbone: efficientnet_b0    # timm backbone
  projection_dim: 128         # projection head output dim
  pretrained: true             # use ImageNet pretrained backbone

training:
  epochs: 100
  batch_size: 256
  lr: 0.001
  weight_decay: 1e-4
  temperature: 0.07           # NT-Xent temperature
  warmup_epochs: 10           # lr warmup
  scheduler: cosine            # cosine or step
  device: cuda
  seed: 42

augmentation:
  # SpecAugment params
  freq_mask_param: 20         # max freq bands to mask
  time_mask_param: 40         # max time frames to mask
  n_freq_mask: 2              # number of freq masks
  n_time_mask: 2              # number of time masks
  # Volume
  volume_jitter: 0.2          # max volume scale [1-volume_jitter, 1+volume_jitter]
  # Noise
  noise_std: 0.005            # additive white noise std
  # Time crop jitter
  time_crop_jitter: 0.1       # random crop ratio [0, time_crop_jitter]

linear_eval:
  epochs: 30
  batch_size: 256
  lr: 0.01
  weight_decay: 0.0

output:
  run_dir: "./runs_contrastive"
  save_every: 10              # save checkpoint every N epochs
